# Единственная проверка, которую нельзя обойти локально: она видит правку от
# любой сессии и с любой машины. Каталог .github в проект-потребитель не
# копируется — это инфраструктура репозитория набора, а не часть поставки.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node-test:
    # Обе системы: набор разрабатывают и запускают на Windows, а прогон на Linux
    # ловит предположения об оболочке и о регистре путей, которых на Windows не
    # видно. Часть тестов пропускается вне своей системы — их закрывает соседняя
    # строка матрицы.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Шаблон без совпадений node --test считает успехом: переименованный
      # каталог тестов давал бы зелёную проверку без единого теста.
      - name: тестовые файлы на месте
        shell: bash
        run: test -n "$(ls scripts/ralph/*.test.mjs)"
      - name: node --test
        shell: bash
        run: node --test --test-concurrency=1 "scripts/ralph/*.test.mjs"
