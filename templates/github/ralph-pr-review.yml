name: Ralph PR review

on:
  workflow_dispatch:
    inputs:
      pull-number:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ralph-pr-review
      deployment: false
    steps:
      - name: Verify the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
        shell: bash
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Review the PR diff
        id: review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RALPH_REVIEW_PR: ${{ inputs.pull-number }}
          RALPH_REVIEW_MODEL: ${{ vars.RALPH_REVIEW_MODEL }}
          OPENAI_API_KEY: ${{ secrets.RALPH_PR_REVIEW_OPENAI_KEY }}
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/scripts/ralph/ralph-pr-review.mjs"
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && (steps.review.outcome == 'success' || steps.review.outcome == 'failure') }}
        with:
          name: ralph-pr-review
          path: ${{ runner.temp }}/ralph-pr-review.json
          if-no-files-found: error
          retention-days: 7
